<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1E3A8A">
  <title>PayNote - カード使用記録</title>
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" href="icons/favicon.ico">

  <!-- Apple Touch Icon (iOS ホーム画面追加用) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --blue-pale: #eff6ff;
      --green: #22c55e;
      --green-dark: #16a34a;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --red: #ef4444;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--gray-50);
      color: var(--gray-700);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
    }

    /* iOS で入力時に拡大されないよう 16px 以上にする */
    input, select, button { font-family: inherit; font-size: 16px; }

    /* ---- ヘッダー ---- */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--blue);
      color: #fff;
      box-shadow: var(--shadow);
    }
    .app-header h1 {
      margin: 0;
      font-size: 20px;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-header nav { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 8px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: #fff;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, .12); }
    .icon-btn.is-active { background: rgba(255, 255, 255, .25); }
    .icon-btn svg { width: 24px; height: 24px; }
    .qr-btn { font-size: 14px; font-weight: 700; }

    /* ---- 画面共通 ---- */
    .screen {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }
    .screen h2 { margin: 0; font-size: 18px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; }
    .empty { padding: 32px 0; text-align: center; color: var(--gray-500); }

    /* ---- 入力欄 ---- */
    .field > label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 500;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      background: #fff;
      color: inherit;
    }
    .field input.amount { text-align: right; font-size: 18px; }

    /* ---- 入力画面：ラベルと入力欄を横並びにする ---- */
    .input-screen .field { display: flex; align-items: center; gap: 8px; }
    .input-screen .field > label { flex: none; width: 5.5em; margin-bottom: 0; }
    /* 入力欄は全角8文字程度が入る幅に固定する */
    .input-screen .field input, .input-screen .combo-row { flex: none; width: 190px; }
    .input-screen .combo-row input { flex: 1; width: auto; min-width: 0; }

    /* ---- 候補付き入力欄 ---- */
    .combo-row { position: relative; display: flex; }
    .combo-row input[type="text"] { border-radius: var(--radius) 0 0 var(--radius); }
    .combo-toggle {
      flex: none;
      width: 40px;
      border: 1px solid var(--gray-300);
      border-left: 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      background: var(--gray-100);
      color: var(--gray-600);
      cursor: pointer;
    }
    .combo-toggle:disabled { color: var(--gray-300); cursor: default; }
    .combo-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 20;
      max-height: 224px;
      margin: 4px 0 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      box-shadow: 0 10px 15px rgba(0, 0, 0, .1);
    }
    .combo:not(.is-open) .combo-list { display: none; }
    .combo-list button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      text-align: left;
      color: inherit;
      cursor: pointer;
    }
    .combo-list button:hover { background: var(--blue-pale); }
    .combo-list button.is-current { background: var(--blue-pale); font-weight: 600; }

    /* ---- ボタン・メッセージ ---- */
    .primary-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-btn:hover { background: var(--blue-dark); }
    .csv-btn {
      padding: 8px 16px;
      border: 0;
      border-radius: var(--radius);
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .csv-btn:hover { background: var(--green-dark); }
    .csv-btn:disabled { background: var(--gray-300); cursor: default; }
    .message { padding: 8px; border-radius: 6px; text-align: center; }
    .message.is-success { background: #dcfce7; color: #166534; }
    .message.is-error { background: #fee2e2; color: #991b1b; }

    /* ---- 履歴 ---- */
    .month-card {
      overflow: hidden;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .month-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: var(--gray-100);
    }
    .month-head .month { font-weight: 700; }
    .month-head .total { font-size: 14px; }
    .record {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
    }
    .record + .record { border-top: 1px solid var(--gray-200); }
    .record-main { flex: 1; min-width: 0; }
    .record-date { font-size: 12px; color: var(--gray-500); }
    .record-place { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .record-card { font-size: 12px; color: var(--gray-600); }
    .record-side { flex: none; text-align: right; }
    .record-amount { font-weight: 700; white-space: nowrap; }
    .link-btn {
      margin-top: 4px;
      padding: 0;
      border: 0;
      background: none;
      font-size: 12px;
      color: var(--red);
      cursor: pointer;
    }

    /* ---- 設定 ---- */
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card h3 { margin: 0; font-size: 16px; }
    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
    }
    .add-btn {
      flex: none;
      padding: 8px 16px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }
    .add-btn:hover { background: var(--blue-dark); }
    .list { margin: 0; padding: 0; list-style: none; }
    .list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .list li + li { border-top: 1px solid var(--gray-200); }
    .list .note { font-size: 14px; color: var(--gray-500); }

    /* ---- QRコード ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .5);
    }
    .modal {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      padding: 16px;
      background: #fff;
      border-radius: var(--radius);
    }
    .modal h3 { margin: 0; font-size: 16px; text-align: center; }
    .modal .url { margin: 0; font-size: 12px; color: var(--gray-600); text-align: center; word-break: break-all; }
    .modal .close-btn {
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: var(--radius);
      background: var(--gray-200);
      font-weight: 500;
      cursor: pointer;
    }
    .modal .hint { padding: 32px 0; font-size: 14px; text-align: center; color: var(--gray-500); }
    .modal .hint.is-error { color: var(--red); }
    .qr-code svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    'use strict';

    /* ============ 保存領域 ============ */

    const STORAGE_KEYS = {
      records: 'paynote_records',
      cards: 'paynote_cards',
      places: 'paynote_places',
      settings: 'paynote_settings'
    };

    const DEFAULT_SETTINGS = { currency: '円', decimalPlaces: 0 };

    const load = (key, fallback) => {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch {
        return fallback;
      }
    };
    const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    // 旧バージョンの日時付きデータ(datetime)を日付のみに正規化する
    const normalizeRecord = ({ datetime, ...r }) => ({
      ...r,
      date: (r.date || datetime || '').slice(0, 10)
    });

    const todayLocal = () => {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    const state = {
      tab: 'input',
      records: load(STORAGE_KEYS.records, []).map(normalizeRecord),
      cards: load(STORAGE_KEYS.cards, []),
      places: load(STORAGE_KEYS.places, []),
      settings: { ...DEFAULT_SETTINGS, ...load(STORAGE_KEYS.settings, {}) }
    };

    const formatAmount = amount => Number(amount).toLocaleString('ja-JP', {
      minimumFractionDigits: state.settings.decimalPlaces,
      maximumFractionDigits: state.settings.decimalPlaces
    });

    /* ============ DOM生成 ============ */

    let uid = 0;
    const nextId = () => 'f' + (++uid);

    // h('div', { class: 'x', onclick: fn }, 子要素…) で要素を組み立てる
    function h(tag, attrs, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (value === null || value === undefined || value === false) continue;
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key === 'html') node.innerHTML = value;
        else if (key === 'value') node.value = value;
        else if (key === 'disabled' || key === 'hidden') node[key] = true;
        else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value);
      }
      for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) continue;
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      }
      return node;
    }

    const ICONS = {
      input: 'M12 4v16m8-8H4',
      history: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z',
      settings: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z'
    };

    const iconSvg = path =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`;

    /* ============ 候補付き入力欄 ============ */

    // 直接入力でき、▼ から登録済みの候補も選べる入力欄
    function comboField(label, placeholder, options, initial) {
      const id = nextId();
      const input = h('input', { type: 'text', id, placeholder, value: initial || '' });
      const toggle = h('button', {
        type: 'button',
        class: 'combo-toggle',
        text: '▼',
        'aria-label': label + 'の候補から選択',
        title: options.length ? '候補から選択' : '候補がありません',
        disabled: options.length === 0
      });
      const list = h('ul', { class: 'combo-list' },
        options.map(option => h('li', {},
          h('button', {
            type: 'button',
            class: option === initial ? 'is-current' : '',
            text: option,
            onclick: () => {
              input.value = option;
              root.classList.remove('is-open');
            }
          })
        ))
      );
      const root = h('div', { class: 'field combo' },
        h('label', { for: id, text: label }),
        h('div', { class: 'combo-row' }, input, toggle, list)
      );
      toggle.addEventListener('click', () => root.classList.toggle('is-open'));
      return { node: root, getValue: () => input.value };
    }

    // 候補一覧の外をタップしたら閉じる
    document.addEventListener('pointerdown', event => {
      document.querySelectorAll('.combo.is-open').forEach(combo => {
        if (!combo.contains(event.target)) combo.classList.remove('is-open');
      });
    });

    /* ============ 入力画面 ============ */

    function inputScreen(flash) {
      const dateId = nextId();
      const amountId = nextId();
      const decimals = state.settings.decimalPlaces;

      const dateInput = h('input', { type: 'date', id: dateId, value: todayLocal() });
      const amountInput = h('input', {
        type: 'number',
        id: amountId,
        class: 'amount',
        placeholder: '0',
        inputmode: decimals > 0 ? 'decimal' : 'numeric',
        step: decimals > 0 ? Math.pow(10, -decimals).toFixed(decimals) : '1'
      });
      const placeCombo = comboField('場所', '店名などを入力', state.places, '');
      const cardCombo = comboField('支払方法', 'カード名などを入力', state.cards, state.cards[0] || '');

      const message = h('div', { class: 'message', hidden: true });
      let messageTimer = null;
      const showMessage = (type, text, autoHide) => {
        clearTimeout(messageTimer);
        message.className = 'message is-' + type;
        message.textContent = text;
        message.hidden = false;
        if (autoHide) messageTimer = setTimeout(() => { message.hidden = true; }, 2000);
      };

      const handleSave = () => {
        const place = placeCombo.getValue().trim();
        const cardName = cardCombo.getValue().trim();
        const amount = amountInput.value;

        if (!place) return showMessage('error', '場所を入力してください');
        if (!amount || Number(amount) <= 0) return showMessage('error', '金額を入力してください');
        if (!cardName) return showMessage('error', '支払方法を入力してください');

        state.records = [{
          id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
          date: dateInput.value,
          place,
          amount: Number(amount),
          cardName
        }, ...state.records];
        save(STORAGE_KEYS.records, state.records);

        if (!state.places.includes(place)) {
          state.places = [...state.places, place];
          save(STORAGE_KEYS.places, state.places);
        }
        if (!state.cards.includes(cardName)) {
          state.cards = [...state.cards, cardName];
          save(STORAGE_KEYS.cards, state.cards);
        }

        // 入力欄を初期化するため画面ごと組み直し、成功メッセージだけ引き継ぐ
        render({ type: 'success', text: '記録しました' });
      };

      const screen = h('div', { class: 'screen input-screen' },
        h('h2', { text: 'カード使用を記録' }),
        h('div', { class: 'field' }, h('label', { for: dateId, text: '日付' }), dateInput),
        h('div', { class: 'field' },
          h('label', { for: amountId, text: `金額（${state.settings.currency}）` }),
          amountInput
        ),
        placeCombo.node,
        cardCombo.node,
        message,
        h('button', { class: 'primary-btn', text: '記録する', onclick: handleSave })
      );

      if (flash) showMessage(flash.type, flash.text, true);
      return screen;
    }

    /* ============ 履歴画面 ============ */

    function exportCsv() {
      const header = '日付,場所,金額,支払方法\n';
      const escape = s => `"${String(s).replace(/"/g, '""')}"`;
      const rows = [...state.records]
        .sort((a, b) => a.date.localeCompare(b.date))
        .map(r => {
          const amount = Number(r.amount).toFixed(state.settings.decimalPlaces);
          return `${r.date},${escape(r.place)},${amount},${escape(r.cardName)}`;
        })
        .join('\n');
      const csv = '﻿' + header + rows + '\n';
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const a = h('a', { href: url, download: `paynote_${todayLocal()}.csv` });
      a.click();
      URL.revokeObjectURL(url);
    }

    function deleteRecord(id) {
      if (!confirm('この記録を削除しますか？')) return;
      state.records = state.records.filter(r => r.id !== id);
      save(STORAGE_KEYS.records, state.records);
      render();
    }

    function historyScreen() {
      const groups = new Map();
      [...state.records]
        .sort((a, b) => b.date.localeCompare(a.date))
        .forEach(r => {
          const month = r.date.slice(0, 7);
          if (!groups.has(month)) groups.set(month, []);
          groups.get(month).push(r);
        });

      const monthCards = [...groups].map(([month, records]) => {
        const total = records.reduce((sum, r) => sum + Number(r.amount), 0);
        return h('div', { class: 'month-card' },
          h('div', { class: 'month-head' },
            h('span', { class: 'month', text: month }),
            h('span', { class: 'total' },
              '合計 ',
              h('b', { text: formatAmount(total) }),
              ' ' + state.settings.currency
            )
          ),
          records.map(r => h('div', { class: 'record' },
            h('div', { class: 'record-main' },
              h('div', { class: 'record-date', text: r.date }),
              h('div', { class: 'record-place', text: r.place }),
              h('div', { class: 'record-card', text: r.cardName })
            ),
            h('div', { class: 'record-side' },
              h('div', { class: 'record-amount', text: `${formatAmount(r.amount)} ${state.settings.currency}` }),
              h('button', { class: 'link-btn', text: '削除', onclick: () => deleteRecord(r.id) })
            )
          ))
        );
      });

      return h('div', { class: 'screen' },
        h('div', { class: 'row-between' },
          h('h2', { text: '履歴' }),
          h('button', {
            class: 'csv-btn',
            text: 'CSV出力',
            disabled: state.records.length === 0,
            onclick: exportCsv
          })
        ),
        state.records.length === 0
          ? h('p', { class: 'empty', text: '記録がありません' })
          : monthCards
      );
    }

    /* ============ 設定画面 ============ */

    // 候補（支払方法・場所）の追加・削除をまとめた区画
    function listSection(title, itemLabel, items, onChange) {
      const input = h('input', { type: 'text', placeholder: itemLabel });
      const add = () => {
        const value = input.value.trim();
        if (!value || items.includes(value)) return;
        onChange([...items, value]);
      };
      input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

      return h('section', { class: 'card' },
        h('h3', { text: title }),
        h('div', { class: 'add-row' },
          input,
          h('button', { class: 'add-btn', text: '追加', onclick: add })
        ),
        h('ul', { class: 'list' },
          items.length === 0
            ? h('li', {}, h('span', { class: 'note', text: '未登録（記録時に自動登録されます）' }))
            : items.map(item => h('li', {},
                h('span', { text: item }),
                h('button', {
                  class: 'link-btn',
                  text: '削除',
                  onclick: () => {
                    if (!confirm(`${itemLabel}「${item}」を削除しますか？`)) return;
                    onChange(items.filter(x => x !== item));
                  }
                })
              ))
        )
      );
    }

    function settingsScreen() {
      const currencyId = nextId();
      const decimalId = nextId();

      const currencyInput = h('input', {
        type: 'text',
        id: currencyId,
        value: state.settings.currency,
        placeholder: '例: 円, $, €'
      });
      currencyInput.addEventListener('input', () => {
        state.settings = { ...state.settings, currency: currencyInput.value };
        save(STORAGE_KEYS.settings, state.settings);
      });

      const decimalSelect = h('select', { id: decimalId },
        [['0', '0（整数）'], ['1', '1'], ['2', '2'], ['3', '3']].map(([value, label]) =>
          h('option', { value, text: label })
        )
      );
      decimalSelect.value = String(state.settings.decimalPlaces);
      decimalSelect.addEventListener('change', () => {
        state.settings = { ...state.settings, decimalPlaces: Number(decimalSelect.value) };
        save(STORAGE_KEYS.settings, state.settings);
      });

      return h('div', { class: 'screen' },
        h('h2', { text: '設定' }),
        h('section', { class: 'card' },
          h('h3', { text: '通貨設定' }),
          h('div', { class: 'field' }, h('label', { for: currencyId, text: '通貨単位' }), currencyInput),
          h('div', { class: 'field' }, h('label', { for: decimalId, text: '小数点以下の桁数' }), decimalSelect)
        ),
        listSection('支払方法管理', '支払方法', state.cards, next => {
          state.cards = next;
          save(STORAGE_KEYS.cards, state.cards);
          render();
        }),
        listSection('場所管理', '場所', state.places, next => {
          state.places = next;
          save(STORAGE_KEYS.places, state.places);
          render();
        })
      );
    }

    /* ============ サイトのQRコード ============ */

    const SITE_URL = new URL('.', location.href).href;
    const QR_SCRIPT_SRC = 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js';
    let qrScriptPromise = null;

    // QR生成ライブラリは初回表示時にだけ読み込む
    const loadQrScript = () => {
      if (window.qrcode) return Promise.resolve();
      if (!qrScriptPromise) {
        qrScriptPromise = new Promise((resolve, reject) => {
          const el = h('script', { src: QR_SCRIPT_SRC });
          el.onload = resolve;
          el.onerror = () => { qrScriptPromise = null; reject(new Error('QRライブラリの読み込みに失敗')); };
          document.head.appendChild(el);
        });
      }
      return qrScriptPromise;
    };

    function openQrModal() {
      const body = h('div', { class: 'hint', text: '生成中…' });
      const close = () => overlay.remove();
      const modal = h('div', { class: 'modal' },
        h('h3', { text: 'このサイトのQRコード' }),
        body,
        h('p', { class: 'url', text: SITE_URL }),
        h('button', { class: 'close-btn', text: '閉じる', onclick: close })
      );
      const overlay = h('div', {
        class: 'modal-overlay',
        onclick: e => { if (e.target === overlay) close(); }
      }, modal);
      document.body.appendChild(overlay);

      loadQrScript().then(() => {
        const qr = qrcode(0, 'M');   // 型番は自動判定、誤り訂正レベルM
        qr.addData(SITE_URL);
        qr.make();
        body.replaceWith(h('div', {
          class: 'qr-code',
          html: qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true })
        }));
      }).catch(() => {
        body.className = 'hint is-error';
        body.textContent = 'QRコードを生成できませんでした。通信環境を確認してください。';
      });
    }

    /* ============ 更新チェック ============ */
    /* ヘッダーのタイトルをタップした時に実行。画面上の表示は行わない */

    let updateRequested = false;
    let reloading = false;

    const reloadOnce = () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    };

    // Cache Storage に保存済みのアプリ本体(HTML)を取り出す
    const readCachedHtml = async () => {
      for (const key of await caches.keys()) {
        const cache = await caches.open(key);
        const hit = (await cache.match('./index.html')) || (await cache.match('./'));
        if (hit) return hit.text();
      }
      return null;
    };

    // 配信中のアプリ本体とキャッシュを比べ、異なっていればキャッシュを破棄して読み込み直す
    const checkForUpdate = async () => {
      if (!('serviceWorker' in navigator) || !('caches' in window)) return;
      updateRequested = true;
      try {
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) await registration.update();

        // _nc 付きの要求は Service Worker がキャッシュを介さずに通す
        const res = await fetch(`./index.html?_nc=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;

        const latestHtml = await res.text();
        const cachedHtml = await readCachedHtml();
        if (cachedHtml === null || cachedHtml === latestHtml) return;

        await Promise.all((await caches.keys()).map(key => caches.delete(key)));
        reloadOnce();
      } catch {
        // オフライン時などは何もしない
      }
    };

    /* ============ 全体描画 ============ */

    function header() {
      const tabButton = (key, label) => h('button', {
        class: 'icon-btn' + (state.tab === key ? ' is-active' : ''),
        'aria-label': label,
        title: label,
        html: iconSvg(ICONS[key]),
        onclick: () => {
          if (state.tab === key) return;
          state.tab = key;
          render();
        }
      });

      return h('header', { class: 'app-header' },
        h('h1', { text: 'PayNote', onclick: checkForUpdate }),
        h('nav', {},
          tabButton('input', '入力'),
          tabButton('history', '履歴'),
          // QRボタンは設定ボタンの左に置く
          h('button', {
            class: 'icon-btn qr-btn',
            text: 'QR',
            'aria-label': 'QRコード',
            title: 'QRコード',
            onclick: openQrModal
          }),
          tabButton('settings', '設定')
        )
      );
    }

    const root = document.getElementById('root');

    function render(flash) {
      const screen =
        state.tab === 'history' ? historyScreen() :
        state.tab === 'settings' ? settingsScreen() :
        inputScreen(flash);
      root.replaceChildren(header(), h('main', {}, screen));
    }

    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
      // 更新チェックによって新しい Service Worker が有効になった時だけ読み込み直す
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updateRequested) reloadOnce();
      });
    }
  </script>
</body>
</html>
