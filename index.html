<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1E3A8A">
  <title>PayNote - カード使用記録</title>
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" href="icons/favicon.ico">

  <!-- Apple Touch Icon (iOS ホーム画面追加用) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif; }
    input, select { font-size: 16px; }
    .qr-code svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEYS = {
      records: 'paynote_records',
      cards: 'paynote_cards',
      places: 'paynote_places',
      settings: 'paynote_settings'
    };

    const DEFAULT_SETTINGS = { currency: '円', decimalPlaces: 0 };

    const load = (key, fallback) => {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch {
        return fallback;
      }
    };
    const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    const todayLocal = () => {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    // 旧バージョンの日時付きデータ(datetime)を日付のみに正規化する
    const normalizeRecord = ({ datetime, ...r }) => ({
      ...r,
      date: (r.date || datetime || '').slice(0, 10)
    });

    const formatAmount = (amount, settings) => {
      const n = Number(amount);
      return n.toLocaleString('ja-JP', {
        minimumFractionDigits: settings.decimalPlaces,
        maximumFractionDigits: settings.decimalPlaces
      });
    };

    // 直接入力でき、▼ から登録済みの候補も選べる入力欄
    function ComboField({ label, options, value, onChange, placeholder }) {
      const [open, setOpen] = useState(false);
      const boxRef = useRef(null);

      // 候補一覧の外をタップしたら閉じる
      useEffect(() => {
        if (!open) return;
        const onPointerDown = e => {
          if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener('pointerdown', onPointerDown);
        return () => document.removeEventListener('pointerdown', onPointerDown);
      }, [open]);

      return (
        <div ref={boxRef} className="relative">
          <label className="block text-sm font-medium mb-1 text-gray-700">{label}</label>
          <div className="flex">
            <input
              type="text"
              value={value}
              onChange={e => onChange(e.target.value)}
              placeholder={placeholder}
              className="flex-1 min-w-0 border rounded-l-lg p-2"
            />
            <button
              type="button"
              onClick={() => setOpen(o => !o)}
              disabled={options.length === 0}
              aria-label={`${label}の候補から選択`}
              title={options.length === 0 ? '候補がありません' : '候補から選択'}
              className="shrink-0 w-11 border border-l-0 rounded-r-lg bg-gray-100 text-gray-600 disabled:text-gray-300"
            >▼</button>
          </div>
          {open && options.length > 0 && (
            <ul className="absolute z-20 left-0 right-0 mt-1 max-h-56 overflow-auto bg-white border rounded-lg shadow-lg">
              {options.map(o => (
                <li key={o}>
                  <button
                    type="button"
                    onClick={() => { onChange(o); setOpen(false); }}
                    className={`w-full text-left px-3 py-2 hover:bg-blue-50 ${o === value ? 'bg-blue-50 font-medium' : ''}`}
                  >{o}</button>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    function InputScreen({ records, setRecords, cards, setCards, places, setPlaces, settings }) {
      const [date, setDate] = useState(todayLocal());
      const [place, setPlace] = useState('');
      const [amount, setAmount] = useState('');
      const [cardName, setCardName] = useState(cards[0] || '');
      const [message, setMessage] = useState(null);

      useEffect(() => {
        if (!cardName && cards.length > 0) setCardName(cards[0]);
      }, [cards]);

      const handleSave = () => {
        if (!place.trim()) { setMessage({ type: 'error', text: '場所を入力してください' }); return; }
        if (!amount || Number(amount) <= 0) { setMessage({ type: 'error', text: '金額を入力してください' }); return; }
        if (!cardName.trim()) { setMessage({ type: 'error', text: '支払方法を入力してください' }); return; }

        const newRecord = {
          id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
          date,
          place: place.trim(),
          amount: Number(amount),
          cardName: cardName.trim()
        };
        setRecords([newRecord, ...records]);

        if (!places.includes(place.trim())) {
          setPlaces([...places, place.trim()]);
        }

        if (!cards.includes(cardName.trim())) {
          setCards([...cards, cardName.trim()]);
        }

        setMessage({ type: 'success', text: '記録しました' });
        setPlace('');
        setAmount('');
        setDate(todayLocal());
        setTimeout(() => setMessage(null), 2000);
      };

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-lg font-bold text-gray-700">カード使用を記録</h2>

          <div>
            <label className="block text-sm font-medium mb-1 text-gray-700">日付</label>
            <input
              type="date"
              value={date}
              onChange={e => setDate(e.target.value)}
              className="w-full border rounded-lg p-2"
            />
          </div>

          <div>
            <label className="block text-sm font-medium mb-1 text-gray-700">
              金額（{settings.currency}）
            </label>
            <input
              type="number"
              inputMode={settings.decimalPlaces > 0 ? 'decimal' : 'numeric'}
              step={settings.decimalPlaces > 0 ? Math.pow(10, -settings.decimalPlaces).toFixed(settings.decimalPlaces) : '1'}
              value={amount}
              onChange={e => setAmount(e.target.value)}
              className="w-full border rounded-lg p-2 text-right text-lg"
              placeholder="0"
            />
          </div>

          <ComboField
            label="場所"
            options={places}
            value={place}
            onChange={setPlace}
            placeholder="店名などを入力"
          />

          <ComboField
            label="支払方法"
            options={cards}
            value={cardName}
            onChange={setCardName}
            placeholder="カード名などを入力"
          />

          {message && (
            <div className={`p-2 rounded text-center ${message.type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
              {message.text}
            </div>
          )}

          <button
            onClick={handleSave}
            className="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-bold"
          >
            記録する
          </button>
        </div>
      );
    }

    function HistoryScreen({ records, setRecords, settings }) {
      const grouped = useMemo(() => {
        const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));
        const groups = {};
        sorted.forEach(r => {
          const month = r.date.slice(0, 7);
          if (!groups[month]) groups[month] = [];
          groups[month].push(r);
        });
        return groups;
      }, [records]);

      const monthlyTotals = useMemo(() => {
        const totals = {};
        Object.entries(grouped).forEach(([month, recs]) => {
          totals[month] = recs.reduce((sum, r) => sum + Number(r.amount), 0);
        });
        return totals;
      }, [grouped]);

      const handleExport = () => {
        const header = '日付,場所,金額,支払方法\n';
        const rows = [...records]
          .sort((a, b) => a.date.localeCompare(b.date))
          .map(r => {
            const escape = s => `"${String(s).replace(/"/g, '""')}"`;
            const amount = Number(r.amount).toFixed(settings.decimalPlaces);
            return `${r.date},${escape(r.place)},${amount},${escape(r.cardName)}`;
          })
          .join('\n');
        const csv = '﻿' + header + rows + '\n';
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `paynote_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleDelete = (id) => {
        if (confirm('この記録を削除しますか？')) {
          setRecords(records.filter(r => r.id !== id));
        }
      };

      return (
        <div className="p-4 space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold text-gray-700">履歴</h2>
            <button
              onClick={handleExport}
              disabled={records.length === 0}
              className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium disabled:bg-gray-300"
            >CSV出力</button>
          </div>

          {records.length === 0 ? (
            <p className="text-gray-500 text-center py-8">記録がありません</p>
          ) : (
            Object.entries(grouped).map(([month, recs]) => (
              <div key={month} className="bg-white rounded-lg shadow overflow-hidden">
                <div className="bg-gray-100 px-4 py-2 flex justify-between items-center">
                  <span className="font-bold">{month}</span>
                  <span className="text-sm">
                    合計 <span className="font-bold">{formatAmount(monthlyTotals[month], settings)}</span> {settings.currency}
                  </span>
                </div>
                <div className="divide-y">
                  {recs.map(r => (
                    <div key={r.id} className="p-3 flex justify-between items-start gap-2">
                      <div className="flex-1 min-w-0">
                        <div className="text-xs text-gray-500">{r.date}</div>
                        <div className="font-medium truncate">{r.place}</div>
                        <div className="text-xs text-gray-600">{r.cardName}</div>
                      </div>
                      <div className="text-right shrink-0">
                        <div className="font-bold whitespace-nowrap">
                          {formatAmount(r.amount, settings)} {settings.currency}
                        </div>
                        <button
                          onClick={() => handleDelete(r.id)}
                          className="text-xs text-red-500 hover:text-red-700 mt-1"
                        >削除</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))
          )}
        </div>
      );
    }

    function SettingsScreen({ cards, setCards, places, setPlaces, settings, setSettings }) {
      const [newCard, setNewCard] = useState('');
      const [newPlace, setNewPlace] = useState('');

      const addCard = () => {
        const v = newCard.trim();
        if (v && !cards.includes(v)) {
          setCards([...cards, v]);
          setNewCard('');
        }
      };

      const removeCard = (c) => {
        if (confirm(`支払方法「${c}」を削除しますか？`)) {
          setCards(cards.filter(x => x !== c));
        }
      };

      const addPlace = () => {
        const v = newPlace.trim();
        if (v && !places.includes(v)) {
          setPlaces([...places, v]);
          setNewPlace('');
        }
      };

      const removePlace = (p) => {
        if (confirm(`場所「${p}」を削除しますか？`)) {
          setPlaces(places.filter(x => x !== p));
        }
      };

      return (
        <div className="p-4 space-y-6">
          <h2 className="text-lg font-bold text-gray-700">設定</h2>

          <section className="bg-white p-4 rounded-lg shadow space-y-3">
            <h3 className="font-bold text-gray-700">通貨設定</h3>
            <div>
              <label className="block text-sm mb-1 text-gray-600">通貨単位</label>
              <input
                type="text"
                value={settings.currency}
                onChange={e => setSettings({ ...settings, currency: e.target.value })}
                className="w-full border rounded p-2"
                placeholder="例: 円, $, €"
              />
            </div>
            <div>
              <label className="block text-sm mb-1 text-gray-600">小数点以下の桁数</label>
              <select
                value={settings.decimalPlaces}
                onChange={e => setSettings({ ...settings, decimalPlaces: Number(e.target.value) })}
                className="w-full border rounded p-2 bg-white"
              >
                <option value="0">0（整数）</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>
          </section>

          <section className="bg-white p-4 rounded-lg shadow space-y-3">
            <h3 className="font-bold text-gray-700">支払方法管理</h3>
            <div className="flex gap-2">
              <input
                type="text"
                value={newCard}
                onChange={e => setNewCard(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addCard()}
                placeholder="支払方法名"
                className="flex-1 border rounded p-2"
              />
              <button
                onClick={addCard}
                className="bg-blue-500 hover:bg-blue-600 text-white px-4 rounded font-medium"
              >追加</button>
            </div>
            <ul className="divide-y">
              {cards.map(c => (
                <li key={c} className="py-2 flex justify-between items-center">
                  <span>{c}</span>
                  <button onClick={() => removeCard(c)} className="text-red-500 hover:text-red-700 text-sm">削除</button>
                </li>
              ))}
              {cards.length === 0 && (
                <li className="py-2 text-gray-500 text-sm">未登録（記録時に自動登録されます）</li>
              )}
            </ul>
          </section>

          <section className="bg-white p-4 rounded-lg shadow space-y-3">
            <h3 className="font-bold text-gray-700">場所管理</h3>
            <div className="flex gap-2">
              <input
                type="text"
                value={newPlace}
                onChange={e => setNewPlace(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addPlace()}
                placeholder="場所名"
                className="flex-1 border rounded p-2"
              />
              <button
                onClick={addPlace}
                className="bg-blue-500 hover:bg-blue-600 text-white px-4 rounded font-medium"
              >追加</button>
            </div>
            <ul className="divide-y">
              {places.map(p => (
                <li key={p} className="py-2 flex justify-between items-center">
                  <span>{p}</span>
                  <button onClick={() => removePlace(p)} className="text-red-500 hover:text-red-700 text-sm">削除</button>
                </li>
              ))}
              {places.length === 0 && (
                <li className="py-2 text-gray-500 text-sm">未登録（記録時に自動登録されます）</li>
              )}
            </ul>
          </section>
        </div>
      );
    }

    // ---- サイトのQRコード ----
    const SITE_URL = new URL('.', location.href).href;
    const QR_SCRIPT_SRC = 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js';
    let qrScriptPromise = null;

    // QR生成ライブラリは初回表示時にだけ読み込む
    const loadQrScript = () => {
      if (window.qrcode) return Promise.resolve();
      if (!qrScriptPromise) {
        qrScriptPromise = new Promise((resolve, reject) => {
          const el = document.createElement('script');
          el.src = QR_SCRIPT_SRC;
          el.onload = resolve;
          el.onerror = () => { qrScriptPromise = null; reject(new Error('QRライブラリの読み込みに失敗')); };
          document.head.appendChild(el);
        });
      }
      return qrScriptPromise;
    };

    function QrModal({ onClose }) {
      const [svgTag, setSvgTag] = useState('');
      const [failed, setFailed] = useState(false);

      useEffect(() => {
        let active = true;
        loadQrScript()
          .then(() => {
            const qr = qrcode(0, 'M');   // 型番は自動判定、誤り訂正レベルM
            qr.addData(SITE_URL);
            qr.make();
            if (active) setSvgTag(qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true }));
          })
          .catch(() => { if (active) setFailed(true); });
        return () => { active = false; };
      }, []);

      return (
        <div
          className="fixed inset-0 bg-black/50 flex items-center justify-center p-6 z-50"
          onClick={onClose}
        >
          <div
            className="bg-white rounded-lg p-4 w-full max-w-xs space-y-3"
            onClick={e => e.stopPropagation()}
          >
            <h3 className="font-bold text-gray-700 text-center">このサイトのQRコード</h3>
            {failed ? (
              <p className="text-sm text-red-600 text-center py-8">
                QRコードを生成できませんでした。通信環境を確認してください。
              </p>
            ) : svgTag ? (
              <div className="qr-code" dangerouslySetInnerHTML={{ __html: svgTag }} />
            ) : (
              <p className="text-sm text-gray-500 text-center py-8">生成中…</p>
            )}
            <p className="text-xs text-gray-600 break-all text-center">{SITE_URL}</p>
            <button
              onClick={onClose}
              className="w-full bg-gray-200 hover:bg-gray-300 rounded-lg py-2 font-medium"
            >閉じる</button>
          </div>
        </div>
      );
    }

    // ---- 更新チェック（ヘッダーのタイトルをタップした時に実行。画面上の表示は行わない） ----
    let updateRequested = false;
    let reloading = false;

    const reloadOnce = () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    };

    // Cache Storage に保存済みのアプリ本体(HTML)を取り出す
    const readCachedHtml = async () => {
      for (const key of await caches.keys()) {
        const cache = await caches.open(key);
        const hit = (await cache.match('./index.html')) || (await cache.match('./'));
        if (hit) return hit.text();
      }
      return null;
    };

    // 配信中のアプリ本体とキャッシュを比べ、異なっていればキャッシュを破棄して読み込み直す
    const checkForUpdate = async () => {
      if (!('serviceWorker' in navigator) || !('caches' in window)) return;
      updateRequested = true;
      try {
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) await registration.update();

        // _nc 付きの要求は Service Worker がキャッシュを介さずに通す
        const res = await fetch(`./index.html?_nc=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;

        const latestHtml = await res.text();
        const cachedHtml = await readCachedHtml();
        if (cachedHtml === null || cachedHtml === latestHtml) return;

        await Promise.all((await caches.keys()).map(key => caches.delete(key)));
        reloadOnce();
      } catch {
        // オフライン時などは何もしない
      }
    };

    function App() {
      const [tab, setTab] = useState('input');
      const [showQr, setShowQr] = useState(false);
      const [records, setRecords] = useState(() => load(STORAGE_KEYS.records, []).map(normalizeRecord));
      const [cards, setCards] = useState(() => load(STORAGE_KEYS.cards, []));
      const [places, setPlaces] = useState(() => load(STORAGE_KEYS.places, []));
      const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...load(STORAGE_KEYS.settings, {}) }));

      useEffect(() => save(STORAGE_KEYS.records, records), [records]);
      useEffect(() => save(STORAGE_KEYS.cards, cards), [cards]);
      useEffect(() => save(STORAGE_KEYS.places, places), [places]);
      useEffect(() => save(STORAGE_KEYS.settings, settings), [settings]);

      const TABS = [
        ['input', '入力', 'M12 4v16m8-8H4'],
        ['history', '履歴', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z'],
        ['settings', '設定', 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z']
      ];

      return (
        <div className="min-h-screen">
          <header className="bg-blue-500 text-white p-4 shadow flex justify-between items-center">
            <h1 className="text-xl font-bold select-none" onClick={checkForUpdate}>PayNote</h1>
            <nav className="flex gap-1 items-center">
              {TABS.map(([key, label, path]) => (
                <React.Fragment key={key}>
                  {/* QRボタンは設定ボタンの左に置く */}
                  {key === 'settings' && (
                    <button
                      onClick={() => setShowQr(true)}
                      aria-label="QRコード"
                      title="QRコード"
                      className="w-10 p-2 rounded-lg transition-colors hover:bg-white/10 text-sm font-bold leading-6"
                    >QR</button>
                  )}
                  <button
                    onClick={() => setTab(key)}
                    aria-label={label}
                    title={label}
                    className={`p-2 rounded-lg transition-colors ${tab === key ? 'bg-white/25' : 'hover:bg-white/10'}`}
                  >
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d={path} />
                    </svg>
                  </button>
                </React.Fragment>
              ))}
            </nav>
          </header>

          <main>
            {tab === 'input' && (
              <InputScreen
                records={records} setRecords={setRecords}
                cards={cards} setCards={setCards}
                places={places} setPlaces={setPlaces}
                settings={settings}
              />
            )}
            {tab === 'history' && (
              <HistoryScreen records={records} setRecords={setRecords} settings={settings} />
            )}
            {tab === 'settings' && (
              <SettingsScreen
                cards={cards} setCards={setCards}
                places={places} setPlaces={setPlaces}
                settings={settings} setSettings={setSettings}
              />
            )}
          </main>

          {showQr && <QrModal onClose={() => setShowQr(false)} />}
        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
      // 更新チェックによって新しい Service Worker が有効になった時だけ読み込み直す
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updateRequested) reloadOnce();
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
